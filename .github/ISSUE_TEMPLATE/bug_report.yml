name: Bug report
description: Chef Shared Loader, its options menu or a mod running on it doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please attach chef_loader.log from %APPDATA%\Arrowhead\Helldivers2 (type %APPDATA%\Arrowhead\Helldivers2 into the File Explorer address bar and press Enter). It shows that the loader started, which mods it found, any Lua errors and its timings.
  - type: input
    id: version
    attributes:
      label: Loader version
      description: The first line of chef_loader.log says it.
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version / date of the last game update
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options:
        - At start-up / on the title screen
        - On the ship
        - In a mission
        - Everywhere
        - Not sure
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what happened instead (a screenshot helps). If a mod is involved, the status line on its title bar in F9 (its state, version and last error) says a lot.
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods
      description: The mods running on Chef Shared Loader (chef_loader_health.txt lists them, with their state), anything else that replaces the game's boot script or the game's settings files (Medic File Mod Merger, for example), and your mod manager.
  - type: textarea
    id: options
    attributes:
      label: Loader options
      description: Anything you changed in F9 > Chef Shared Loader (Compact look, Controls, Language, the performance monitor), and whether you used CRASH RECOVERY, a mod's on/off switch or "Reset every option to its default" before it happened.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag chef_loader.log here, plus chef_loader_health.txt and chef_loader_state.txt from the same folder (and the mod's own log, if it has one).
